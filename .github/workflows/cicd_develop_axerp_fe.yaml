# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy AXERP FE to DEV/TEST environment

env:
  STORAGE_NAME: axerpuitest # set this to your storage's name
  AZURE_STORAGE_KEY: ${{ secrets.SKTC_XGZ_AXRP_AXRPUI_TST_BLSTRG_KEY }}
  # CONNECTION_STRING: ${{ secrets.SKTC_XGZ_AXRP_AXRPUI_TST_BLSTRG_CNNSTR }}
  PROJECT_NAME: axerp
  SHA_SHORT_COMMIT_NUMBER: 0
  PACKAGE_VERSION: 0
  API_URL: https://axerpazurefunctiontest.azurewebsites.net/
  AXERP_TEST_API_CONFIG_REDIRECT: https://test.axerp.axegaz.com/index.html

on:
  workflow_dispatch

jobs:
  build:
#    if: ${{ github.event.pull_request.merged }}
    name: Build AXERP FE Angular project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout from repository
        uses: actions/checkout@v3

      - name: Get Short SHA commit number
        shell: bash
        run: |
          echo "SHA_SHORT_COMMIT_NUMBER=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install
        
#      - name: Versioning
#        run: npm version minor && npm publish && npm version patch 
#        #&& git push --tags && git push origin master

      - name: Print Package Version
        run: |
          echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: package.json info
        id: info
        uses: jaywcjlove/github-action-package@main
        with:
          version: ${{ env.PACKAGE_VERSION }} - ${{ env.SHA_SHORT_COMMIT_NUMBER }}
      - run: echo "${{ env.PACKAGE_VERSION }} - ${{ env.SHA_SHORT_COMMIT_NUMBER }}"

      - name: Inject secrets into environment.ts
        run: node update-environment.js
        env:
          API_URL: ${{ env.API_URL }}
          CLIENT_ID: ${{ secrets.AXERP_TEST_AUTH_CLIENT_ID }}
          AUTHORITY: ${{ secrets.AXERP_TEST_AUTH_AUTHORITY }}
          REDIRECT: ${{ env.AXERP_TEST_API_CONFIG_REDIRECT }}
          URI: ${{ env.API_URL }}

      - name: Show environment.ts contents
        run: cat src/environments/environment.ts

      - name: Copy environment.ts to environment.staging.ts
        run: cp src/environments/environment.ts src/environments/environment.staging.ts
        
     # - name: Early exit
     #   run: |
     #     gh run cancel ${{ github.run_id }}
     #     gh run watch ${{ github.run_id }}
     #   env:
     #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          
      - name: Build
        run: npm run build-staging
        #run: ng build --prod --base-href   

      #- name: Run tests
      #  run: npm run test -- --configuration production
      #  env:
      #      CI: true
        # npm run test :headless
        
      - name: Archive build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deploy_dist_${{ github.sha }}
          path: dist

  deploy:
 #    if: ${{ github.event.pull_request.merged }}
      name: Deploy to Azure blob storage
      runs-on: ubuntu-latest
      needs: build
      environment: 
        name: Development
        url: https://${{ env.STORAGE_NAME }}.z6.web.core.windows.net/index.html
      steps:
       - name: Download build artifact
         uses: actions/download-artifact@v4
         with:
           name: deploy_dist_${{ github.sha }}
           path: ./dist

       - name: Clean blob storage '$web' container
         uses: azure/CLI@v1
         with:
           inlineScript: |
             az storage blob delete-batch \
               --account-name ${{ env.STORAGE_NAME }} \
               --auth-mode key \
               --source '$web' \
               --pattern '*'
         env:
           AZURE_STORAGE_KEY: ${{ env.AZURE_STORAGE_KEY }}
            
       - name: Upload SPA to Azure Blob Storage
         uses: azure/CLI@v1
         with:
           inlineScript: |
             az storage blob upload-batch \
               --account-name ${{ env.STORAGE_NAME }} \
               --auth-mode key \
               --destination '$web' \
               --source "./dist/${{ env.PROJECT_NAME }}/browser" \
               --overwrite
         env:
           AZURE_STORAGE_KEY: ${{ env.AZURE_STORAGE_KEY }}
